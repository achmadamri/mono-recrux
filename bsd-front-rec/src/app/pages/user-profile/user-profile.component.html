<div class="main-content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-8">
        <div class="card">
          <div class="card-header card-header-danger">
            <h4 class="card-title">Edit Profile</h4>
          </div>
          <div class="card-body">
            <form>
              <div class="row">
                <div class="col-md-12">
                  <mat-form-field class="example-full-width">
                    <input matInput placeholder="Email address" type="email" [(ngModel)]="userGetResponse.tbUser.tbuEmail" name="tbuEmail" readonly>
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6">
                  <mat-form-field class="example-full-width">
                    <input matInput placeholder="First Name" [(ngModel)]="userGetResponse.tbUser.tbuFirstname" name="tbuFirstname" readonly>
                  </mat-form-field>
                </div>
                <div class="col-md-6">
                  <mat-form-field class="example-full-width">
                    <input matInput placeholder="Last Name" [(ngModel)]="userGetResponse.tbUser.tbuLastname" name="tbuLastname" readonly>
                  </mat-form-field>
                </div>
              </div>
              <button mat-raised-button type="submit" class="btn btn-danger pull-right">Update</button>
              <div class="clearfix"></div>
            </form>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card">
          <div class="card-header card-header-danger">
            <h4 class="card-title">Company</h4>
          </div>
          <div class="card-body">
            <form>
              <div class="row">
                <div class="col-md-12">
                  <mat-form-field class="example-full-width">
                    <input matInput placeholder="Name" [(ngModel)]="userGetResponse.tbCompany.tbcName" name="tbcName" readonly>
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-md-6">
                  <mat-form-field class="example-full-width">
                    <input matInput placeholder="Parse" [(ngModel)]="userGetResponse.tbCompany.tbcParse" name="tbcParse" readonly>
                  </mat-form-field>
                </div>
                <div class="col-md-6">
                  <mat-form-field class="example-full-width">
                    <input matInput placeholder="Token" [(ngModel)]="userGetResponse.tbCompany.tbcToken" name="tbcToken" readonly>
                  </mat-form-field>
                </div>
              </div>
              <div class="clearfix"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-8">
        <div class="card">
          <div class="card-header card-header-danger">
            <h4 class="card-title">Payment</h4>
          </div>
          <div class="card-body">
            <form>
              <div class="row">
                <div class="col-md-8">
                  <mat-radio-group aria-label="Status" name="tbpType" name="tbrStatus">
                    <mat-radio-button value="active">Active</mat-radio-button>
                    &nbsp;
                    <mat-radio-button value="not active">Not Active</mat-radio-button>
                  </mat-radio-group>
                </div>
              </div>
              <br>
              <ngx-paypal [config]="payPalConfig"></ngx-paypal>
              <div class="clearfix"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
