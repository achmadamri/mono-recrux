<div class="main-content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-6">
        <div class="card">
          <div class="card-header card-header-danger">
            <h4 class="card-title">{{postAddResumeRequest.tbResume.tbrDataNameRaw}}</h4>
          </div>
          <div class="card-body">
            <form>
              <div class="row">
                <div class="col-md-12">
                  <mat-form-field class="example-full-width">
                    <input matInput placeholder="Id" type="text" [(ngModel)]="postAddResumeRequest.tbResume.tbrUuid" name="tbrUuid" disabled>
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-md-12">
                  <mat-form-field class="example-full-width">
                    <input matInput placeholder="Name" type="text" [(ngModel)]="postAddResumeRequest.tbResume.tbrDataNameRaw" name="tbrDataNameRaw">
                  </mat-form-field>
                </div>
              </div>
              <div class="row">
                <div class="col-md-12">
                  <mat-radio-group aria-label="Status" name="tbpType" [(ngModel)]="postAddResumeRequest.tbResume.tbrStatus" name="tbrStatus">
                    <mat-radio-button value="active">Active</mat-radio-button>
                    &nbsp;
                    <mat-radio-button value="not active">Not Active</mat-radio-button>
                  </mat-radio-group>
                </div>
              </div>
              <button mat-raised-button type="submit" class="btn btn-danger pull-right" [disabled]="clicked" (click)="update();">Update</button>
              <button mat-raised-button type="button" class="btn btn-danger pull-right" [disabled]="clicked" (click)="back();">Back</button>
              <div class="clearfix"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-12 col-md-12">
        <div class="card">
          <div class="card-header card-header-tabs card-header-danger">
            <div class="nav-tabs-navigation">
              <div class="nav-tabs-wrapper">
                <ul class="nav nav-tabs" data-tabs="tabs">
                  <li class="nav-item">
                    <a mat-button class="nav-link active" href="#personaldetails" data-toggle="tab">
                      <i class="material-icons">settings</i> Personal Details
                      <div class="ripple-container"></div>
                    </a>
                  </li>
                  <li class="nav-item">
                    <a mat-button class="nav-link" href="#education" data-toggle="tab">
                      <i class="material-icons">cloud_upload</i> Education
                      <div class="ripple-container"></div>
                    </a>
                  </li>
                  <li class="nav-item">
                    <a mat-button class="nav-link" href="#workexperience" data-toggle="tab">
                      <i class="material-icons">cloud_upload</i> Work Experience
                      <div class="ripple-container"></div>
                    </a>
                  </li>
                  <li class="nav-item">
                    <a mat-button class="nav-link" href="#skills" data-toggle="tab">
                      <i class="material-icons">cloud_upload</i> Skills
                      <div class="ripple-container"></div>
                    </a>
                  </li>
                  <li class="nav-item">
                    <a mat-button class="nav-link" href="#certifications" data-toggle="tab">
                      <i class="material-icons">cloud_upload</i> Certifications
                      <div class="ripple-container"></div>
                    </a>
                  </li>
                </ul>
              </div>
            </div>
          </div>
          <div class="card-body">
            <div class="tab-content">
              <div class="tab-pane active" id="personaldetails">
                <form>
                  <div class="row">
                    <div class="col-md-4">
                      <mat-form-field class="example-full-width">
                        <input matInput placeholder="Title" type="text" [(ngModel)]="postAddResumeRequest.tbResume.tbrDataNameTitle" name="tbrDataNameTitle">
                      </mat-form-field>
                    </div>
                    <div class="col-md-4">
                      <mat-form-field class="example-full-width">
                        <input matInput placeholder="Total Experience" type="text" [(ngModel)]="postAddResumeRequest.tbResume.tbrDataTotalYearsExperience" name="tbrDataTotalYearsExperience">
                      </mat-form-field>
                    </div>
                  </div>
                  <div class="row">
                    <div class="col-md-4">
                      <mat-form-field class="example-full-width">
                        <input matInput placeholder="Fist Name" type="text" [(ngModel)]="postAddResumeRequest.tbResume.tbrDataNameFirst" name="tbrDataNameFirst">
                      </mat-form-field>
                    </div>
                    <div class="col-md-4">
                      <mat-form-field class="example-full-width">
                        <input matInput placeholder="Middle Name" type="text" [(ngModel)]="postAddResumeRequest.tbResume.tbrDataNameMiddle" name="tbrDataNameMiddle">
                      </mat-form-field>
                    </div>
                    <div class="col-md-4">
                      <mat-form-field class="example-full-width">
                        <input matInput placeholder="Last Name" type="text" [(ngModel)]="postAddResumeRequest.tbResume.tbrDataNameLast" name="tbrDataNameLast">
                      </mat-form-field>
                    </div>                    
                  </div>
                  <div class="row">
                    <div class="col-md-4">
                      <mat-form-field class="example-full-width">
                        <input matInput placeholder="Date Of Birth" type="text" [(ngModel)]="postAddResumeRequest.tbResume.tbrDataDateOfBirth" name="tbrDataDateOfBirth">
                      </mat-form-field>
                    </div>
                  </div>
                  <div class="row">
                    <div class="col-md-4">
                      <mat-form-field class="example-full-width">
                        <input matInput placeholder="Phone Number" type="text" [(ngModel)]="postAddResumeRequest.tbResume.tbrDataPhoneNumbers" name="tbrDataPhoneNumbers">
                      </mat-form-field>
                    </div>
                    <div class="col-md-4">
                      <mat-form-field class="example-full-width">
                        <input matInput placeholder="Email" type="text" [(ngModel)]="postAddResumeRequest.tbResume.tbrDataEmails" name="tbrDataEmails">
                      </mat-form-field>
                    </div>
                    <div class="col-md-4">
                      <mat-form-field class="example-full-width">
                        <input matInput placeholder="Website" type="text" [(ngModel)]="postAddResumeRequest.tbResume.tbrDataWebsites" name="tbrDataWebsites">
                      </mat-form-field>
                    </div>                    
                  </div>
                  <div class="row">
                    <div class="col-md-4">
                      <mat-form-field class="example-full-width">
                        <input matInput placeholder="Street" type="text" [(ngModel)]="postAddResumeRequest.tbResume.tbrDataLocationStreet" name="tbrDataLocationStreet">
                      </mat-form-field>
                    </div>
                    <div class="col-md-4">
                      <mat-form-field class="example-full-width">
                        <input matInput placeholder="Number" type="text" [(ngModel)]="postAddResumeRequest.tbResume.tbrDataLocationApartmentNumber" name="tbrDataLocationApartmentNumber">
                      </mat-form-field>
                    </div>
                    <div class="col-md-4">
                      <mat-form-field class="example-full-width">
                        <input matInput placeholder="City" type="text" [(ngModel)]="postAddResumeRequest.tbResume.tbrDataLocationCity" name="tbrDataLocationCity">
                      </mat-form-field>
                    </div>                    
                  </div>
                  <div class="row">
                    <div class="col-md-4">
                      <mat-form-field class="example-full-width">
                        <input matInput placeholder="State" type="text" [(ngModel)]="postAddResumeRequest.tbResume.tbrDataLocationState" name="tbrDataLocationState">
                      </mat-form-field>
                    </div>
                    <div class="col-md-4">
                      <mat-form-field class="example-full-width">
                        <input matInput placeholder="Country" type="text" [(ngModel)]="postAddResumeRequest.tbResume.tbrDataLocationCountry" name="tbrDataLocationCountry">
                      </mat-form-field>
                    </div>
                    <div class="col-md-4">
                      <mat-form-field class="example-full-width">
                        <input matInput placeholder="Postal Code" type="text" [(ngModel)]="postAddResumeRequest.tbResume.tbrDataLocationPostalCode" name="tbrDataLocationPostalCode">
                      </mat-form-field>
                    </div>                    
                  </div>
                  <button mat-raised-button type="button" class="btn btn-danger pull-right" [disabled]="clicked">Update</button>
                  <button mat-raised-button type="button" class="btn btn-danger pull-right" [disabled]="clicked" (click)="back();">Back</button>
                  <div class="clearfix"></div>
                </form>
              </div>
              <div class="tab-pane active" id="education">
              </div>
              <div class="tab-pane" id="workexperience">
              </div>
              <div class="tab-pane" id="skills">
              </div>
              <div class="tab-pane" id="certifications">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
