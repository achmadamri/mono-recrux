<div class="main-content">
  <div class="container-fluid">
      <div class="row">
          <div class="col-md-6">
              <div class="card">
                  <div class="card-header card-header-danger">
                      <h4 class="card-title">Register Page</h4>
                      <p class="card-category">Register your account and get free trial. No cc required.</p>
                  </div>
                  <div class="card-body">
                      <form>
                        <div class="row">
                            <div class="col-md-6">
                              <mat-form-field class="example-full-width">
                                <input matInput placeholder="First Name" type="text" [(ngModel)]="userRegisterRequest.tbUser.tbuFirstname">
                              </mat-form-field>
                            </div>
                            <div class="col-md-6">
                              <mat-form-field class="example-full-width">
                                <input matInput placeholder="Last Name" type="text" [(ngModel)]="userRegisterRequest.tbUser.tbuLastname">
                              </mat-form-field>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12">
                              <mat-form-field class="example-full-width">
                                <input matInput placeholder="Email" type="text" [(ngModel)]="userRegisterRequest.tbUser.tbuEmail">
                              </mat-form-field>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12">
                              <mat-form-field class="example-full-width">
                                <input matInput placeholder="Company" type="text" [(ngModel)]="userRegisterRequest.tbCompany.tbcName">
                              </mat-form-field>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12">
                              <mat-form-field class="example-full-width">
                                <input matInput placeholder="Password" type="password" [(ngModel)]="userRegisterRequest.tbUser.tbuPassword">
                              </mat-form-field>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12">
                              <mat-form-field class="example-full-width">
                                <input matInput placeholder="Confirm Password" type="password" [(ngModel)]="userRegisterRequest.tbUser.tbuPasswordConfirm">
                              </mat-form-field>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12">
                              <mat-form-field class="example-full-width">
                                <input matInput placeholder="Phone Number" type="phone" [(ngModel)]="userRegisterRequest.tbUser.tbuMobilePhone">
                              </mat-form-field>
                            </div>
                        </div>
                        <div class="row">
                          <div class="col-md-12">
                            <input type="checkbox" [(ngModel)]="userRegisterRequest.agree"> I agree to the privacy policy and terms and conditions
                          </div>
                        </div>
                        <br>
                        <a href="javascript:void(0)" (click)="login();">Login</a>
                        <button mat-raised-button type="submit" class="btn btn-danger pull-right" [disabled]="clicked" (click)="register();">Register</button>
                        <div class="clearfix"></div>
                      </form>
                  </div>
              </div>
          </div>
      </div>
  </div>
</div>
