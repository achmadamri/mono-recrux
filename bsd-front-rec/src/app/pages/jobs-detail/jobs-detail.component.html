<div class="main-content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-lg-6 col-md-12">
                <div class="card">
                    <div class="card-header card-header-tabs card-header-danger">
                        <div class="nav-tabs-navigation">
                            <div class="nav-tabs-wrapper">
                                <span class="nav-tabs-title">Job</span>
                                <ul class="nav nav-tabs" data-tabs="tabs">
                                    <li class="nav-item">
                                        <a mat-button class="nav-link active" href="#job" data-toggle="tab">
                                            <i class="material-icons">settings_applications</i> {{postAddJobRequest.tbJob.tbjName}}
                                            <div class="ripple-container"></div>
                                        </a>
                                    </li>
                                    <li class="nav-item">
                                        <a mat-button class="nav-link" href="#resumeuppload" data-toggle="tab">
                                            <i class="material-icons">cloud_upload</i> Resume Upload
                                            <div class="ripple-container"></div>
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="tab-content">
                            <div class="tab-pane active" id="job">
                                <form>
                                    <div class="row">
                                        <div class="col-md-12">
                                          <mat-form-field class="example-full-width">
                                            <input matInput placeholder="Name" type="text" [(ngModel)]="postAddJobRequest.tbJob.tbjName">
                                          </mat-form-field>
                                        </div>
                                    </div>
                                    <div class="row" *ngIf="saveUpdate == 'Update'">
                                        <div class="col-md-12">
                                            <mat-radio-group aria-label="Status" [(ngModel)]="postAddJobRequest.tbJob.tbjStatus" name="tbjStatus">
                                                <mat-radio-button value="active">Active</mat-radio-button>
                                                &nbsp;
                                                <mat-radio-button value="not active">Not Active</mat-radio-button>
                                            </mat-radio-group>
                                        </div>
                                    </div>
                                    <button mat-raised-button type="submit" class="btn btn-danger pull-right" [disabled]="clicked" (click)="saveupdate();">{{saveUpdate}}</button>
                                    <div class="clearfix"></div>
                                </form>
                            </div>
                            <div class="tab-pane" id="resumeuppload">
                                <form>
                                    <div class="row">
                                        <div class="col-md-12">
                                        <input type="file" #fileInput (change)="onFileChanged($event)" multiple/>
                                        <mat-progress-bar mode="determinate" [value]="uploadPercentage"></mat-progress-bar>
                                        {{uploadPercentage}}%
                                        <br/>
                                        {{totalUpload}} file(s) uploaded
                                        </div>
                                    </div>
                                    <button mat-raised-button type="button" class="btn btn-danger pull-right" [disabled]="clicked" (click)="upload();">Upload</button>
                                    <button mat-raised-button type="button" class="btn btn-danger pull-right" [disabled]="clicked" (click)="back();">Back</button>
                                    <div class="clearfix"></div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
