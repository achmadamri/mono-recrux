<div class="main-content">
  <div class="container-fluid">
      <div class="row">
          <div class="col-md-4">
              <div class="card">
                  <div class="card-header card-header-danger">
                      <h4 class="card-title">Login Page</h4>
                      <p class="card-category">Login into your account</p>
                  </div>
                  <div class="card-body">
                      <form>
                        <div class="row">
                            <div class="col-md-12">
                              <mat-form-field class="example-full-width">
                                <input matInput placeholder="Email" type="text" [(ngModel)]="authGenerateRequest.tbaEmail">
                              </mat-form-field>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-12">
                              <mat-form-field class="example-full-width">
                                <input matInput placeholder="Password" type="password" [(ngModel)]="authGenerateRequest.tbaPassword">
                              </mat-form-field>
                            </div>
                        </div>
                        <a href="javascript:void(0)" (click)="register();">Register</a>
                        <button mat-raised-button type="submit" class="btn btn-danger pull-right" [disabled]="clicked" (click)="login();">Login</button>
                        <div class="clearfix"></div>
                      </form>
                  </div>
              </div>
          </div>
      </div>
  </div>
</div>
