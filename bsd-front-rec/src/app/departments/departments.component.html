<div class="main-content">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header card-header-danger">
                        <h4 class="card-title" style="cursor:pointer" title="Click to view search" (click)="searchFormClick();">Departments</h4>
                    </div>
                    <div class="card-body" *ngIf="searchForm">
                        <form>
                            <div class="row">
                                <div class="col-md-12">
                                  <mat-form-field class="example-full-width">
                                    <input matInput placeholder="Name" type="text">
                                  </mat-form-field>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-12">                                                                   
                                    <mat-radio-group name="tbpType">
                                        <mat-radio-button value="active">Active</mat-radio-button>
                                        &nbsp;
                                        <mat-radio-button value="not active">Not Active</mat-radio-button>
                                    </mat-radio-group>
                                </div>
                            </div>
                            <button mat-raised-button type="submit" class="btn btn-danger pull-right">Search</button>
                            <div class="clearfix"></div>
                        </form>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <mat-paginator [length]="length" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions" (page)="getPage($event)" [disabled]="clicked"></mat-paginator>
                            <table class="table table-hover">
                                <thead>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Status</th>
                                    <th></th>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>5</td>
                                        <td>Information Technology</td>
                                        <td>Active</td>
                                        <td class="td-actions text-right">                                            
                                            <button mat-raised-button type="button" class="btn btn-primary btn-link btn-sm btn-just-icon">
                                                <i class="material-icons" title="View">visibility</i>
                                            </button>
                                            <button mat-raised-button type="button" class="btn btn-danger btn-link btn-sm btn-just-icon">
                                                <i class="material-icons" title="Deactivate">close</i>
                                            </button>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>5</td>
                                        <td>Product</td>
                                        <td>Active</td>
                                        <td class="td-actions text-right">                                            
                                            <button mat-raised-button type="button" class="btn btn-primary btn-link btn-sm btn-just-icon">
                                                <i class="material-icons" title="View">visibility</i>
                                            </button>
                                            <button mat-raised-button type="button" class="btn btn-danger btn-link btn-sm btn-just-icon">
                                                <i class="material-icons" title="Deactivate">close</i>
                                            </button>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>5</td>
                                        <td>Office</td>
                                        <td>Deactivated</td>
                                        <td class="td-actions text-right">
                                            <button mat-raised-button type="button" class="btn btn-primary btn-link btn-sm btn-just-icon">
                                                <i class="material-icons" title="View">visibility</i>
                                            </button>
                                            <button mat-raised-button type="button" class="btn btn-danger btn-link btn-sm btn-just-icon">
                                                <i class="material-icons" title="Activate">check</i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                            <mat-paginator [length]="length" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions" (page)="getPage($event)" [disabled]="clicked"></mat-paginator>
                            <input type="button" class="btn btn-danger pull-right" value="Add" [disabled]="clicked" (click)="add();"/>
                        </div>                                                
                    </div>                    
                </div>
            </div>
        </div>
    </div>
</div>
